name: Check FOD hashes
description: Verify the declared hashes of fixed-output derivations in a flake, skipping the check when the derivations have not changed since the last success
inputs:
  attributes:
    description: Attribute paths under packages.<system> of the flake, separated by whitespace or newlines, such as amphi-web.pnpmDeps
    required: true
  flake:
    description: Flake reference
    default: .
  use-cache:
    description: Skip the check when a success for the same derivations is cached. With false, always check.
    default: "true"
outputs:
  key:
    description: SHA-256 over the check version, the system, and the derivation paths of the attributes
    value: ${{ steps.key.outputs.key }}
  cache-hit:
    description: Whether the check was skipped because a success for the same key was cached
    value: ${{ steps.check.outcome == 'skipped' }}
runs:
  using: composite
  steps:
    - name: Compute key
      id: key
      shell: bash
      env:
        # Bump only when the check itself changes what it verifies.
        CHECK_VERSION: "1"
        ATTRIBUTES: ${{ inputs.attributes }}
        FLAKE: ${{ inputs.flake }}
        USE_CACHE: ${{ inputs.use-cache }}
      run: |
        set -euo pipefail

        case "$USE_CACHE" in
          true | false) ;;
          *)
            echo "::error::use-cache must be true or false, got: $USE_CACHE"
            exit 1
            ;;
        esac

        mapfile -t attributes < <(tr -s '[:space:]' '\n' <<< "$ATTRIBUTES" | sed '/^$/d' | sort -u)
        if [ "${#attributes[@]}" -eq 0 ]; then
          echo "::error::attributes must list at least one attribute path"
          exit 1
        fi

        system=$(nix eval --impure --raw --expr builtins.currentSystem)

        # Quote every segment, so names such as foo+bar work in both the
        # expression and the installables.
        segment='[^."\$]+'
        installables=()
        fields=""
        for attribute in "${attributes[@]}"; do
          if ! [[ "$attribute" =~ ^$segment(\.$segment)*$ ]]; then
            echo "::error::Unsupported attribute path: $attribute"
            exit 1
          fi
          IFS=. read -r -a segments <<< "$attribute"
          path=$(printf '."%s"' "${segments[@]}")
          installables+=("$FLAKE#packages.\"$system\"$path")
          fields+="\"$attribute\" = packages$path.drvPath; "
        done

        inputs=$(nix eval --json --no-write-lock-file "$FLAKE#packages.\"$system\"" --apply "packages: {
          version = \"$CHECK_VERSION\";
          system = \"$system\";
          drvs = { $fields};
        }")
        echo "Key inputs: $inputs"
        key=$(KEY_INPUTS=$inputs nix eval --impure --raw --expr 'builtins.hashString "sha256" (builtins.getEnv "KEY_INPUTS")')
        echo "Key: $key"

        {
          echo "key=$key"
          echo "marker=.fod-hash-check-success"
          echo "installables<<EOF"
          printf '%s\n' "${installables[@]}"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    # Only cache-hit matters, so nothing is downloaded.
    - name: Look up cached success
      id: restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.key.outputs.marker }}
        key: fod-hash-check-${{ steps.key.outputs.key }}
        lookup-only: true

    - name: Check hashes
      id: check
      if: inputs.use-cache != 'true' || steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        INSTALLABLES: ${{ steps.key.outputs.installables }}
        KEY: ${{ steps.key.outputs.key }}
        MARKER: ${{ steps.key.outputs.marker }}
      run: |
        set -euo pipefail
        mapfile -t installables <<< "$INSTALLABLES"
        command=(nix build --no-link --no-write-lock-file)

        # --rebuild requires valid outputs, including on a clean store.
        set -x
        "${command[@]}" "${installables[@]}"
        "${command[@]}" --rebuild "${installables[@]}"
        { set +x; } 2> /dev/null

        echo "$KEY" > "$GITHUB_WORKSPACE/$MARKER"

    # Saved here rather than in a post step, so a later failure in the job
    # keeps the result.
    - name: Cache success
      if: steps.check.outcome == 'success' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.key.outputs.marker }}
        key: fod-hash-check-${{ steps.key.outputs.key }}

    - name: Remove marker
      if: always() && steps.key.outputs.marker != ''
      shell: bash
      env:
        MARKER: ${{ steps.key.outputs.marker }}
      run: rm -f "$GITHUB_WORKSPACE/$MARKER"
