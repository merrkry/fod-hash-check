name: Check FOD hashes
description: Verify the declared hashes of fixed-output derivations in Nix, skipping the check when the derivations have not changed since the last success
inputs:
  installables:
    description: Nix installables to check, separated by whitespace or newlines, such as .#web.pnpmDeps. Set either this or config.
    default: ""
  config:
    description: TOML file listing the installables to check. Defaults to fod-hashes.toml when installables is not set.
    default: ""
  use-cache:
    description: Skip the check when a success for the same derivations is cached. With false, always check.
    default: "true"
  update:
    description: On a hash mismatch, write the correct hash into the file of the target and check again. Needs config.
    default: "false"
outputs:
  key:
    description: SHA-256 over the check version, the system, and the derivation paths of the installables
    value: ${{ steps.key.outputs.key }}
  cache-hit:
    description: Whether the check was skipped because a success for the same key was cached
    value: ${{ steps.check.outcome == 'skipped' }}
  updated:
    description: Whether update wrote new hashes into the files of the targets
    value: ${{ steps.check.outputs.updated == 'true' }}
runs:
  using: composite
  steps:
    - name: Compute key
      id: key
      shell: bash
      env:
        # Bump only when the check itself changes what it verifies.
        CHECK_VERSION: "1"
        INSTALLABLES: ${{ inputs.installables }}
        CONFIG: ${{ inputs.config }}
        UPDATE: ${{ inputs.update }}
      run: |
        if [ -n "$INSTALLABLES" ] && [ -n "$CONFIG" ]; then
          echo "::error::Set either installables or config, not both"
          exit 1
        fi
        if [ -n "$INSTALLABLES" ] && [ "$UPDATE" = true ]; then
          echo "::error::update needs config, which lists the files to update"
          exit 1
        fi
        if [ -z "$INSTALLABLES" ]; then
          CONFIG=${CONFIG:-fod-hashes.toml}
          if [ ! -f "$CONFIG" ]; then
            echo "::error::Config file not found: $CONFIG"
            exit 1
          fi
          [[ $CONFIG == /* ]] || CONFIG=$PWD/$CONFIG
          export CONFIG
          INSTALLABLES=$(nix eval --impure --raw --file "$GITHUB_ACTION_PATH/config.nix" installables)
          FILES=$(nix eval --impure --raw --file "$GITHUB_ACTION_PATH/config.nix" files)
        fi
        read -r -d '' -a installables <<< "$INSTALLABLES" || true
        if [ "${#installables[@]}" -eq 0 ]; then
          echo "::error::No installables to check"
          exit 1
        fi
        export DERIVATIONS=$RUNNER_TEMP/fod-hash-check-derivations.json
        nix derivation show --no-write-lock-file "${installables[@]}" > "$DERIVATIONS"
        result=$(nix eval --impure --raw --file "$GITHUB_ACTION_PATH/key.nix")
        read -r key drvs <<< "$result"
        echo "Key: $key"
        echo "Derivations: $drvs"
        {
          echo "key=$key"
          echo "drvs=$drvs"
          echo "installables=${installables[*]}"
          # One file per line, since names may contain spaces.
          echo "files<<FOD_HASH_CHECK_EOF"
          if [ -n "${FILES:-}" ]; then
            echo "$FILES"
          fi
          echo "FOD_HASH_CHECK_EOF"
        } >> "$GITHUB_OUTPUT"

    # Only cache-hit matters, so nothing is downloaded.
    - name: Look up cached success
      id: restore
      uses: actions/cache/restore@v6
      with:
        path: .fod-hash-check-success
        key: fod-hash-check-${{ steps.key.outputs.key }}
        lookup-only: true

    - name: Check hashes
      id: check
      if: inputs.use-cache != 'true' || steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        DRVS: ${{ steps.key.outputs.drvs }}
        INSTALLABLES: ${{ steps.key.outputs.installables }}
        FILES: ${{ steps.key.outputs.files }}
        UPDATE: ${{ inputs.update }}
        # The mismatches are read from the build log.
        NO_COLOR: "1"
      run: |
        read -r -a drvs <<< "$DRVS"
        log=$RUNNER_TEMP/fod-hash-check-build.log

        trace() {
          echo "+ $*"
          "$@"
        }

        # Builds the derivations, then rebuilds those whose outputs are valid,
        # and keeps a copy of the output in $log. --rebuild needs valid
        # outputs, including on a clean store, and fails as a whole if one is
        # missing, e.g. after a mismatch in the first build. Both builds run
        # either way, so the log has every mismatch.
        check() {
          {
            built=0
            trace nix build --no-link --keep-going "$@" || built=$?
            valid=()
            for drv in "$@"; do
              if nix path-info "$drv" > /dev/null 2>&1; then
                valid+=("$drv")
              fi
            done
            rebuilt=0
            if [ "${#valid[@]}" -gt 0 ]; then
              trace nix build --no-link --keep-going --rebuild "${valid[@]}" || rebuilt=$?
            fi
            [ "$built" -eq 0 ] && [ "$rebuilt" -eq 0 ]
          } 2>&1 | tee "$log"
        }

        if check "${drvs[@]}"; then
          touch .fod-hash-check-success
          exit 0
        fi
        if [ "$UPDATE" != true ]; then
          exit 1
        fi

        files=()
        while IFS= read -r file; do
          if [ -n "$file" ]; then
            files+=("$file")
          fi
        done <<< "$FILES"
        for file in "${files[@]}"; do
          if [ ! -f "$file" ]; then
            echo "::error::File of a target not found: $file"
            exit 1
          fi
        done

        # Find every hash before changing any file. Each specified hash must
        # belong to one mismatch and occur exactly once across the files.
        specified=()
        got=()
        targets=()
        failed=false
        while read -r old new; do
          for seen in "${specified[@]}"; do
            if [ "$seen" = "$old" ]; then
              echo "::error::Several derivations declare $old, so it was not updated."
              failed=true
              continue 2
            fi
          done
          matches=()
          for file in "${files[@]}"; do
            count=$({ grep -oF -- "$old" "$file" || true; } | wc -l)
            for ((i = 0; i < count; i++)); do
              matches+=("$file")
            done
          done
          if [ "${#matches[@]}" -ne 1 ]; then
            echo "::error::Found $old ${#matches[@]} times in the files of the targets, so it was not updated. The correct hash is $new."
            failed=true
            continue
          fi
          specified+=("$old")
          got+=("$new")
          targets+=("${matches[0]}")
        done < <(awk '
          /hash mismatch in fixed-output derivation/ { mismatch = 1 }
          mismatch && $1 == "specified:" { specified = $2 }
          mismatch && $1 == "got:" { print specified, $2; mismatch = 0 }
        ' "$log")
        if [ "$failed" = true ] || [ "${#specified[@]}" -eq 0 ]; then
          exit 1
        fi

        # Restored if the check after updating fails, e.g. because a replaced
        # hash was also declared by a derivation that matched it.
        backup=$RUNNER_TEMP/fod-hash-check-backup
        rm -rf "$backup"
        mkdir "$backup"
        for i in "${!files[@]}"; do
          cp "${files[$i]}" "$backup/$i"
        done

        # Go through placeholders, so a new hash that equals another
        # specified hash is not replaced again.
        replace() {
          sed -i.fod-hash-check "s|$1|$2|" "$3"
          rm "$3.fod-hash-check"
        }
        for i in "${!specified[@]}"; do
          replace "${specified[$i]}" "@fod-hash-check-$i@" "${targets[$i]}"
        done
        for i in "${!specified[@]}"; do
          replace "@fod-hash-check-$i@" "${got[$i]}" "${targets[$i]}"
          echo "Updated ${targets[$i]}: ${specified[$i]} -> ${got[$i]}"
        done

        echo "Checking again with the updated hashes"
        read -r -a installables <<< "$INSTALLABLES"
        recheck() {
          local list updated_drvs=()
          list=$(nix path-info --derivation --no-write-lock-file "${installables[@]}") || return 1
          while IFS= read -r drv; do
            updated_drvs+=("$drv^*")
          done <<< "$list"
          check "${updated_drvs[@]}"
        }
        if ! recheck; then
          for i in "${!files[@]}"; do
            cp "$backup/$i" "${files[$i]}"
          done
          echo "::error::The check failed after updating, so the files were restored"
          exit 1
        fi
        echo "::warning::Updated the hashes of fixed-output derivations; commit the changed files"
        echo "updated=true" >> "$GITHUB_OUTPUT"

    # Saved here rather than in a post step, so a later failure in the job
    # keeps the result.
    - name: Cache success
      if: steps.check.outcome == 'success' && steps.check.outputs.updated != 'true' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: .fod-hash-check-success
        key: fod-hash-check-${{ steps.key.outputs.key }}

    - name: Remove marker
      if: always()
      shell: bash
      run: rm -f .fod-hash-check-success
