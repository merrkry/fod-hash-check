name: Check FOD hashes
description: Verify the declared hashes of fixed-output derivations in Nix, skipping the check when the derivations have not changed since the last success
inputs:
  installables:
    description: Nix installables to check, separated by whitespace or newlines, such as .#web.pnpmDeps. Set either this or config.
    default: ""
  config:
    description: TOML file listing the installables to check. Defaults to fod-hashes.toml when installables is not set.
    default: ""
  use-cache:
    description: Skip the check when a success for the same derivations is cached. With false, always check.
    default: "true"
outputs:
  key:
    description: SHA-256 over the check version, the system, and the derivation paths of the installables
    value: ${{ steps.key.outputs.key }}
  cache-hit:
    description: Whether the check was skipped because a success for the same key was cached
    value: ${{ steps.check.outcome == 'skipped' }}
runs:
  using: composite
  steps:
    - name: Compute key
      id: key
      shell: bash
      env:
        # Bump only when the check itself changes what it verifies.
        CHECK_VERSION: "1"
        INSTALLABLES: ${{ inputs.installables }}
        CONFIG: ${{ inputs.config }}
      run: |
        if [ -n "$INSTALLABLES" ] && [ -n "$CONFIG" ]; then
          echo "::error::Set either installables or config, not both"
          exit 1
        fi
        if [ -z "$INSTALLABLES" ]; then
          CONFIG=${CONFIG:-fod-hashes.toml}
          if [ ! -f "$CONFIG" ]; then
            echo "::error::Config file not found: $CONFIG"
            exit 1
          fi
          [[ $CONFIG == /* ]] || CONFIG=$PWD/$CONFIG
          INSTALLABLES=$(CONFIG=$CONFIG nix eval --impure --raw --file "$GITHUB_ACTION_PATH/config.nix")
        fi
        read -r -d '' -a installables <<< "$INSTALLABLES" || true
        if [ "${#installables[@]}" -eq 0 ]; then
          echo "::error::No installables to check"
          exit 1
        fi
        export DERIVATIONS=$RUNNER_TEMP/fod-hash-check-derivations.json
        nix derivation show --no-write-lock-file "${installables[@]}" > "$DERIVATIONS"
        result=$(nix eval --impure --raw --file "$GITHUB_ACTION_PATH/key.nix")
        read -r key drvs <<< "$result"
        echo "Key: $key"
        echo "key=$key" >> "$GITHUB_OUTPUT"
        echo "Derivations: $drvs"
        echo "drvs=$drvs" >> "$GITHUB_OUTPUT"

    # Only cache-hit matters, so nothing is downloaded.
    - name: Look up cached success
      id: restore
      uses: actions/cache/restore@v6
      with:
        path: .fod-hash-check-success
        key: fod-hash-check-${{ steps.key.outputs.key }}
        lookup-only: true

    - name: Check hashes
      id: check
      if: inputs.use-cache != 'true' || steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        DRVS: ${{ steps.key.outputs.drvs }}
      run: |
        read -r -a drvs <<< "$DRVS"
        set -x
        # --rebuild requires valid outputs, including on a clean store.
        nix build --no-link --keep-going "${drvs[@]}"
        nix build --no-link --keep-going --rebuild "${drvs[@]}"
        touch .fod-hash-check-success

    # Saved here rather than in a post step, so a later failure in the job
    # keeps the result.
    - name: Cache success
      if: steps.check.outcome == 'success' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: .fod-hash-check-success
        key: fod-hash-check-${{ steps.key.outputs.key }}

    - name: Remove marker
      if: always()
      shell: bash
      run: rm -f .fod-hash-check-success
